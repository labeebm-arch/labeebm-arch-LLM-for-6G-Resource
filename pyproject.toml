[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm6g-priors"
version = "1.0.5"
description = "Reproducibility code for LLM priors in sample-efficient 6G resource allocation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSES/MIT.txt"}
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "scikit-learn>=1.3,<2",
  "requests>=2.31,<3",
  "PyYAML>=6,<7",
  "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSES/MIT.txt"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
